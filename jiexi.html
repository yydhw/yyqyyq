<center style="line-height: 0.1; font-size: 15px; color: #135;">


<div style="text-align: center;">


   <div class="w-full max-w-lg mx-auto bg-white rounded-2xl shadow-xl p-8 mt-6 space-y-8">
   <h1 class="text-xl font-bold text-center leading-loose"> 

    <div class="space-y-3">
        <label class="text-sm font-semibold">选择解析线路 + 输入视频地址/名称</label>
        <select id="lineSelect" onchange="changeBtnColor()" class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
            <option value="">请选择解析线路</option>
            <option value="1" class="line1" selected>线路①（仅支持视频地址）</option>
            <option value="2" class="line2">线路②（支持视频名称或地址）</option>
            <option value="3" class="line3">线路③（仅支持视频地址）</option>
            <option value="4" class="line4">线路④（仅支持视频地址）</option>
            <option value="5" class="line5">线路⑤（仅支持视频地址）</option>
        </select>
        <input id="mainUrl" class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400" placeholder="输入视频地址 / 视频名称">
        <button id="parseBtn" onclick="startParse()" class="w-full py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition">开始解析</button>
    </div>
</div>
<br>

<script>
const apiList = [
    "",
    "https://json.fongmi.cc/web?url=",
    "https://im1907.top/?jx=",
    "https://www.huaqi.live/?url=",
    "https://super.playr.top/?url=",
    "https://jx.2s0.cn/player/?url="
];

// 页面加载自动初始化按钮为线路一蓝色
window.onload = function(){
    changeBtnColor();
};

// 切换线路自动改变按钮颜色
function changeBtnColor(){
    let val = document.getElementById('lineSelect').value;
    let btn = document.getElementById('parseBtn');
    switch(val){
        case "1":
            btn.className = "w-full py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition";
            break;
        case "2":
            btn.className = "w-full py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition";
            break;
        case "3":
            btn.className = "w-full py-3 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700 transition";
            break;
        case "4":
            btn.className = "w-full py-3 bg-yellow-600 text-white rounded-lg font-semibold hover:bg-yellow-700 transition";
            break;
        case "5":
            btn.className = "w-full py-3 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700 transition";
            break;
        default:
            btn.className = "w-full py-3 bg-gray-500 text-white rounded-lg font-semibold transition";
    }
}

function startParse() {
    let lineVal = document.getElementById('lineSelect').value;
    let urlVal = document.getElementById('mainUrl').value.trim();

    if (!lineVal) {
        return alert('请先选择解析线路');
    }
    if (!urlVal) {
        return alert('请输入名称或链接');
    }

    let apiUrl = apiList[lineVal] + encodeURIComponent(urlVal);
    window.open(apiUrl, '_blank');
}
</script>
</body>
