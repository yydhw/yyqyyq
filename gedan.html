<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影音导航</title>
    <link href="./css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="./js/particles.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            min-height: 100%;
        }
        /* 顶部导航栏核心样式 */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(40, 40, 40, 0.95);
            color: #fff;
            padding: 10px 0;
            z-index: 9999;
            box-sizing: border-box;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            width: 100%;
        }
        
        .nav-logo {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .nav-menu li {
            margin-left: 20px;
        }
        
        .nav-menu li a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .nav-menu li a:hover {
            color: #3498db;
        }
        
        /* 适配手机端导航 */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 10px;
            }
            .nav-logo {
                font-size: 16px;
            }
            .nav-menu li {
                margin-left: 12px;
            }
            .nav-menu li a {
                font-size: 13px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-menu li {
                margin-left: 8px;
            }
            .nav-menu li a {
                font-size: 12px;
            }
        }
        
        /* 主体容器：顶部间距正常，底部留大空白 */
        .container {
            padding-top: 70px;
            padding-bottom: 120px; /* 底部留足空白，防止播放器压版权 */
            min-height: 100vh;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* 中间内容：靠上，减少上边距 */
        .content {
            padding: 0 15px;
            margin-top: 20px; /* 播放器整体往上移 */
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .tips {
            background: rgba(255,255,255,0.85);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* 版权置底 适配手机 */
        .copyright {
            position: relative;
            width: 100%;
            text-align: center;
            padding: 15px 10px;
            font-size: 14px;
            color: #666;
            background: #fff;
            margin-top: 0;
        }
        .copyright a {
            color: #666;
            text-decoration: none;
        }
        .copyright a:hover {
            color: #0066cc;
        }
        /* 手机端版权自适应 */
        @media (max-width: 768px) {
            .copyright {
                font-size: 12px;
                padding: 12px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="#" class="nav-logo">影音导航的歌单</a>
            <ul class="nav-menu">
                <li><a href="/">首页</a></li>
                <li><a href="/">导航</a></li>
                <li><a href="/jiexi.html">解析</a></li>
                <li><a href="http://dian.kesug.com">网盘</a></li>
                <li><a href="/gedan.html">歌单</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div id="particles-js"></div>

        <!-- 主体内容 -->
        <div class="content">
            <!-- 使用提示 -->
            <div class="tips">
                使用提示:<br>
                播放器右下角三横可以打开播放列表选歌<br>
                手机息屏后只播放两首，再次亮屏可继续<br>
                
            </div>

            <!-- 播放器脚本 -->
            <script type="text/javascript" src="https://myhkw.cn/player/js/jquery.min.js"></script>
            <script type="text/javascript" id="myhk" src="https://myhkw.cn/api/player/174971890491" key="174971890491" m="1"></script>
        </div>
    </div>

    <!-- 粒子效果脚本 -->
    <script>
        window.onload = function () {
            particlesJS('particles-js', {
                particles: {
                    number: {value: 150, density: {enable: true, value_area: 1200}},
                    color: {value: '#3498db'},
                    shape: {
                        type: 'circle',
                        stroke: {width: 0, color: '#000000'},
                        image: {src: '', width: 100, height: 100}
                    },
                    opacity: {
                        value: 0.7,
                        random: true,
                        anim: {enable: true, speed: 2, opacity_min: 0.3, sync: false}
                    },
                    size: {value: 3, random: true, anim: {enable: true, speed: 3, size_min: 0.5, sync: false}},
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: '#3498db',
                        opacity: 0.6,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: 'none',
                        random: true,
                        straight: false,
                        out_mode: 'out',
                        bounce: false,
                        attract: {
                            enable: true,
                            rotateX: 600,
                            rotateY: 1200
                        }
                    }
                },
                interactivity: {
                    detect_on: 'canvas',
                    events: {
                        onhover: {
                            enable: true,
                            mode: ['bubble', 'attract']
                        },
                        onclick: {enable: true, mode: 'repulse'},
                        resize: true
                    },
                    modes: {
                        attract: {
                            distance: 200,
                            speed: 3
                        },
                        bubble: {
                            distance: 400,
                            size: 10,
                            duration: 2,
                            opacity: 0.8,
                            speed: 3
                        },
                        repulse: {
                            distance: 200,
                            duration: 0.4
                        }
                    }
                },
                retina_detect: true
            });
        };
    </script>

    <!-- 版权信息 在最底部 绝不被播放器遮挡 -->
    <div class="copyright">
        &copy; 2026 <a href="https://yydh.de5.net" rel="nofollow" target="_blank">影音导航</a> &nbsp;|&nbsp; 版权所有
    </div>

</body>
</html>
