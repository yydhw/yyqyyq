    <style>
        /* 顶部导航栏核心样式 */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(40, 40, 40, 0.95);
            color: #fff;
            padding: 10px 0;
            z-index: 9999;
            box-sizing: border-box;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            width: 100%;
        }
        
        .nav-logo {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .nav-menu li {
            margin-left: 20px;
        }
        
        .nav-menu li a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .nav-menu li a:hover {
            color: #3498db;
        }
        
        /* 适配手机端 */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 10px;
            }
            .nav-logo {
                font-size: 16px;
            }
            .nav-menu li {
                margin-left: 12px;
            }
            .nav-menu li a {
                font-size: 13px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-menu li {
                margin-left: 8px;
            }
            .nav-menu li a {
                font-size: 12px;
            }
        }
        
        /* 防止内容被导航栏遮挡 */
        .container {
            margin-top: 60px !important;
        }

        /* ========== 版权居中样式（核心） ========== */
        .copyright {
            width: 100%;
            text-align: center; /* 水平居中 */
            padding: 15px 0;
            font-size: 14px;
            color: #666;
            background: #fff;
            margin-top: 30px; /* 与内容拉开间距 */
        }
        .copyright a {
            color: #666;
            text-decoration: none;
        }
        .copyright a:hover {
            color: #0066cc;
        }
        /* 手机端版权优化 */
        @media (max-width: 768px) {
            .copyright {
                font-size: 12px;
                padding: 12px 0;
            }
        }
    </style>

    <script>
        window.onload = function () {
            particlesJS('particles-js', {
                particles: {
                    number: {value: 150, density: {enable: true, value_area: 1200}},
                    color: {value: '#3498db'},
                    shape: {
                        type: 'circle',
                        stroke: {width: 0, color: '#000000'},
                        image: {src: '', width: 100, height: 100}
                    },
                    opacity: {
                        value: 0.7,
                        random: true,
                        anim: {enable: true, speed: 2, opacity_min: 0.3, sync: false}
                    },
                    size: {value: 3, random: true, anim: {enable: true, speed: 3, size_min: 0.5, sync: false}},
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: '#3498db',
                        opacity: 0.6,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: 'none',
                        random: true,
                        straight: false,
                        out_mode: 'out',
                        bounce: false,
                        attract: {
                            enable: true,
                            rotateX: 600,
                            rotateY: 1200
                        }
                    }
                },
                interactivity: {
                    detect_on: 'canvas',
                    events: {
                        onhover: {
                            enable: true,
                            mode: ['bubble', 'attract']
                        },
                        onclick: {enable: true, mode: 'repulse'},
                        resize: true
                    },
                    modes: {
                        attract: {
                            distance: 200,
                            speed: 3
                        },
                        bubble: {
                            distance: 400,
                            size: 10,
                            duration: 2,
                            opacity: 0.8,
                            speed: 3
                        },
                        repulse: {
                            distance: 200,
                            duration: 0.4
                        }
                    }
                },
                retina_detect: true
            });
        };
    </script>

            function renderLinks(category) {
                const linksContainer = document.getElementById('links-container');
                if (!linksContainer) return;
                
                linksContainer.innerHTML = '';
                
                if (!websites[category]) return;
                
                websites[category].forEach(site => {
                    const linkCard = document.createElement('div');
                    linkCard.className = 'link-card';
                    linkCard.addEventListener('click', () => {
                        window.open(site.url, '_blank');
                    });

                    const icon = document.createElement('img');
                    icon.src = site.icon;
                    icon.alt = site.name;
                    icon.onerror = function () {
                        this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>';
                    };

                    const link = document.createElement('a');
                    link.href = site.url;
                    link.target = '_blank';
                    link.textContent = site.name;

                    const subtitle = document.createElement('div');
                    subtitle.className = 'site-subtitle';
                    subtitle.textContent = site.subtitle;

                    linkCard.appendChild(icon);
                    linkCard.appendChild(link);
                    linkCard.appendChild(subtitle);
                    linksContainer.appendChild(linkCard);
                });
            }

            // 初始化显示常用分类
            renderLinks('常用');

            // 分类切换
            const categoryList = document.getElementById('category-list');
            if (categoryList) {
                categoryList.addEventListener('click', function (e) {
                    const categoryTag = e.target.closest('.category-tag');
                    if (categoryTag) {
                        this.querySelectorAll('.category-tag').forEach(tag => tag.classList.remove('active'));
                        categoryTag.classList.add('active');
                        renderLinks(categoryTag.dataset.category);
                    }
                });
            }

            // 搜索功能
            function performSearch() {
                const searchEngine = document.getElementById('search-engine');
                const searchInput = document.getElementById('search-input');

                if (searchEngine && searchInput && searchInput.value) {
                    window.open(searchEngine.value + encodeURIComponent(searchInput.value), '_blank');
                }
            }

            // 搜索按钮点击事件
            const searchButton = document.querySelector('.search-wrapper button');
            if (searchButton) {
                searchButton.addEventListener('click', performSearch);
            }

            const searchInputElement = document.getElementById('search-input');
            if (searchInputElement) {
